name: Publier une version

# Repris de MountMonitor (gabarit du kit, version multiplateforme) : rien ici n'est propre a une application. Tout ce qui
# varie est lu dans kit.json, a la racine du depot. Pousser un tag « v1.2.3 »
# suffit ; le paquet, l'installeur et l'archive de mise a jour sont construits
# puis attaches a la Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version a construire (sans le v), ex. 1.2.3"
        required: true
  # Appelable depuis un autre workflow du depot. C'est indispensable quand une
  # CI cree elle-meme le tag : GitHub ne declenche aucun workflow sur un
  # evenement produit par le jeton d'un workflow (protection anti-boucle), si
  # bien que le tag arrivait sans que rien ne construise le paquet.
  workflow_call:
    inputs:
      version:
        description: "Version a construire (sans le v)"
        required: true
        type: string
      ref:
        description: "Commit ou tag a construire. Indispensable quand la CI
          appelante vient de pousser un commit de version : sans lui, le job
          reprend le commit declencheur, plus ancien d'une version."
        required: false
        type: string

permissions:
  contents: write
  actions: write          # suppression des artefacts de construction devenus inutiles (job « nettoyer »)

jobs:
  # Un projet dont le paquet depend d'un artefact produit en amont (un moteur
  # 3D exporte, par exemple) ne peut pas etre construit par le simple push du
  # tag : l'artefact n'existe pas encore. Dans ce cas seul l'appel depuis le
  # workflow amont construit, et le declenchement par tag s'efface sans
  # echouer — un echec rouge sur chaque version serait du bruit.
  decider:
    runs-on: ubuntu-latest
    outputs:
      construire: ${{ steps.choix.outputs.construire }}
    steps:
      - uses: actions/checkout@v4
      - id: choix
        shell: bash
        run: |
          ARTEFACT=$(python -c "import json;print(json.load(open('kit.json')).get('artefact_prealable',''))")
          # On ne peut pas se fier a github.event_name : dans un workflow
          # appele, il vaut toujours l'evenement d'origine (« push »), et la
          # condition ecartait justement le cas legitime. C'est la presence
          # d'une version en entree qui distingue un appel d'un declenchement
          # par tag.
          if [ -n "$ARTEFACT" ] && [ -z "${{ inputs.version }}" ]; then
            echo "construire=false" >> "$GITHUB_OUTPUT"
            echo "Paquet construit par le workflow amont (artefact $ARTEFACT) : rien a faire ici."
          else
            echo "construire=true" >> "$GITHUB_OUTPUT"
          fi

  # Windows. Python « embeddable » + Inno Setup.
  build:
    needs: decider
    if: needs.decider.outputs.construire == 'true'
    runs-on: windows-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Lire kit.json
        id: kit
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          k = json.loads(pathlib.Path('kit.json').read_text(encoding='utf-8'))
          exclus = k.get('exclus_de_la_maj') or []
          print('exclus_de_la_maj=' + ' '.join(exclus))
          for cle in ('nom_technique', 'nom_fichier', 'nom_affiche',
                      'depot_distribution', 'point_entree', 'icone', 'appid',
                      'fichier_version', 'artefact_prealable', 'artefact_dossier'):
              print(f"{cle}={k.get(cle, '')}")
          PY

      - name: Determiner la version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          # Un appelant peut transmettre « v1.2.3 » (github.ref_name) aussi
          # bien que « 1.2.3 » : on normalise plutot que de compter sur lui.
          V="${V#v}"
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Version : $V"

      - name: Verifier que la version declaree concorde avec le tag
        shell: bash
        run: |
          FICHIER=$(tr -d ' \r\n' < "${{ steps.kit.outputs.fichier_version }}")
          TAG="${{ steps.version.outputs.value }}"
          if [ "$FICHIER" != "$TAG" ]; then
            echo "::error::Le depot annonce la version '$FICHIER' mais le tag dit '$TAG'."
            echo "Mettez la version a jour avant de poser le tag, sinon"
            echo "l'application proposera sans fin une mise a jour deja installee."
            exit 1
          fi

      # Certains projets ont besoin d'un binaire produit par un job precedent
      # (un moteur 3D exporte, par exemple). kit.json le nomme ; les autres
      # projets sautent cette etape.
      - name: Recuperer l'artefact prealable
        if: ${{ steps.kit.outputs.artefact_prealable != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.kit.outputs.artefact_prealable }}
          path: ${{ steps.kit.outputs.artefact_dossier }}

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Controles statiques, quand le depot les embarque. Ils sont facultatifs
      # par construction : un projet qui ne les a pas passe outre sans echouer.
      # Chacun attrape un defaut qui, autrement, ne se voit que chez
      # l'utilisateur — un nom jamais importe, un signal Qt qui recopie sa
      # charge, un installeur qui ne sait pas que l'application tourne.
      - name: Controles statiques
        shell: bash
        run: |
          for controle in verifier_symboles.py verifier_signaux.py verifier_installeur.py; do
            if [ -f "$controle" ]; then
              echo "--- $controle"
              python "$controle"
            fi
          done

      - name: Construire le paquet autonome
        shell: bash
        run: python build_package.py --out "$RUNNER_TEMP/build"

      - name: Verifier que le paquet demarre
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          PKG="$RUNNER_TEMP/build/${{ steps.kit.outputs.nom_fichier }}"
          "$PKG/python/python.exe" -c "
          import sys, json, pathlib
          sys.path.insert(0, r'$PKG/app')
          from PyQt6.QtWidgets import QApplication
          app = QApplication(sys.argv)
          import coupole.cli, coupole.core.maj, coupole.core.rapports
          kit = json.loads(pathlib.Path(r'$PKG/app/kit.json').read_text(encoding='utf-8'))
          # Modules que l'application doit pouvoir importer : c'est le seul
          # moyen de repérer ici une dependance oubliee dans le paquet, qui
          # ne se verrait sinon qu'au premier lancement chez l'utilisateur.
          for module in kit.get('verification_import', []):
              __import__(module)
              print('  import OK :', module)
          # 0.2.1 : bibliotheques facultatives embarquees (reproject, sep...) essayees pour de vrai : sans elles le
          # module Archives retombait en silence sur scipy et Qualite ne mesurait rien
          essai = kit.get('essai_embarquees')
          if essai:
              m, _, f = essai.partition(':')
              print('  bibliotheques embarquees :', getattr(__import__(m, fromlist=[f]), f)())
          # textes fournis par Qt (boutons standard, dialogue de repli) en francais : traductions gardees
          from coupole.gui import plateforme
          if not plateforme.installer_traductions(app, 'fr'):
              raise SystemExit('Traductions de Qt absentes du paquet')
          print('  traductions de Qt : OK')
          attendue = '${{ steps.version.outputs.value }}'
          vue = pathlib.Path(r'$PKG/app/' + kit['fichier_version']).read_text(encoding='utf-8').strip()
          if vue != attendue:
              raise SystemExit(
                  'Le paquet s annonce en version ' + repr(vue)
                  + ' alors que le tag dit ' + attendue
                  + ' : il proposerait sans fin une mise a jour deja installee.')
          print('paquet fonctionnel, version', vue)
          "

      - name: Preparer l'archive de mise a jour
        shell: bash
        run: |
          # Seuls les fichiers applicatifs : quelques centaines de kilo-octets,
          # contre plusieurs centaines de megaoctets pour le paquet complet.
          # C'est ce que telecharge l'application quand elle se met a jour.
          # On travaille sur une COPIE : l'installeur est compile depuis le
          # paquet, et retirer des fichiers dans le paquet lui-meme livrerait
          # une application amputee de ses donnees.
          rm -rf "$RUNNER_TEMP/maj"
          cp -r "$RUNNER_TEMP/build/${{ steps.kit.outputs.nom_fichier }}/app" "$RUNNER_TEMP/maj"
          cd "$RUNNER_TEMP/maj"
          find . -name '__pycache__' -type d -prune -exec rm -rf {} +
          # Donnees volumineuses qui ne bougent pas d'une version a l'autre
          # (sons, moteur 3D...). Les laisser ferait retelecharger des
          # centaines de megaoctets a chaque correction d'une ligne de code.
          # Quand elles changent, c'est l'installeur complet qu'il faut.
          for DOSSIER in ${{ steps.kit.outputs.exclus_de_la_maj }}; do
            echo "  exclu de l'archive : $DOSSIER"
            rm -rf "$DOSSIER"
          done
          NOM="${{ steps.kit.outputs.nom_technique }}-app-${{ steps.version.outputs.value }}.zip"
          7z a -tzip "$GITHUB_WORKSPACE/$NOM" ./* > /dev/null
          ls -lh "$GITHUB_WORKSPACE/$NOM"

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compiler l'installeur
        # PowerShell et non bash : Git Bash (MSYS) reecrit tout argument
        # commencant par « / » en chemin Windows, si bien qu'ISCC recevait
        # « C:/Program Files/Git/DAppVersion=... » et repondait
        # « You may not specify more than one script filename ».
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DSourceDir=$env:RUNNER_TEMP\build\${{ steps.kit.outputs.nom_fichier }}" `
            "/DAppName=${{ steps.kit.outputs.nom_fichier }}" `
            "/DAppDisplayName=${{ steps.kit.outputs.nom_affiche }}" `
            "/DAppId=${{ steps.kit.outputs.appid }}" `
            "/DIconFile=${{ steps.kit.outputs.icone }}" `
            "/DEntry=${{ steps.kit.outputs.point_entree }}" `
            installer.iss
          Get-ChildItem installer_out

      - name: Deposer les artefacts Windows
        uses: actions/upload-artifact@v4
        with:
          name: paquet-windows
          path: |
            installer_out/${{ steps.kit.outputs.nom_fichier }}-Setup-${{ steps.version.outputs.value }}.exe
            ${{ steps.kit.outputs.nom_technique }}-app-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # macOS et Linux. Meme structure de paquet que Windows — python/ et app/ —
  # pour que la mise a jour automatique fonctionne a l'identique partout.
  # ──────────────────────────────────────────────────────────────────────
  build-unix:
    needs: decider
    if: needs.decider.outputs.construire == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon since 2024, so building only there
          # shipped an arm64-only .dmg: an Intel Mac could not open it at all.
          - os: macos-latest
            plateforme: macos
            arch: arm64
          - os: macos-15-intel
            plateforme: macos
            arch: x86_64
          - os: ubuntu-latest
            plateforme: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            plateforme: linux
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Lire kit.json
        id: kit
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          k = json.load(open('kit.json'))
          for cle in ('nom_technique', 'nom_fichier', 'nom_affiche',
                      'depot_distribution', 'fichier_version'):
              print(f"{cle}={k.get(cle, '')}")
          PY

      - name: Determiner la version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verifier que la version declaree concorde avec le tag
        shell: bash
        run: |
          FICHIER=$(tr -d ' \r\n' < "${{ steps.kit.outputs.fichier_version }}")
          TAG="${{ steps.version.outputs.value }}"
          if [ "$FICHIER" != "$TAG" ]; then
            echo "::error::Le depot annonce '$FICHIER' mais le tag dit '$TAG'."
            exit 1
          fi

      - name: Python de construction
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyQt6 a besoin de ces bibliotheques pour seulement s'importer sur un
      # runner Linux sans serveur graphique ; sans elles, la verification
      # d'import du paquet echoue alors que le paquet est bon.
      - name: Dependances systeme (Linux)
        if: matrix.plateforme == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Construire le paquet
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 build_unix.py --version ${{ steps.version.outputs.value }}

      # 0.2.1 : le paquet (tar.gz, .app du .dmg, base du .deb) doit importer et faire tourner reproject et sep
      # (build_unix.py l'essaie deja apres l'elagage ; refait ici, visible dans le journal de la CI)
      - name: Bibliotheques facultatives embarquees
        shell: bash
        run: |
          NOM="${{ steps.kit.outputs.nom_fichier }}"
          if [ "${{ matrix.plateforme }}" = macos ]; then R="dist/$NOM.app/Contents/Resources"; else R="dist/$NOM"; fi
          cd "$R"
          ./python/bin/python3 -B -c "import sys; sys.path.insert(0, 'app'); from coupole.core.bibliotheques import essai_embarquees; print(essai_embarquees())"

      # 0.1.8 : le lanceur suit les liens symboliques (~/.local/bin/coupole -> Coupole.sh, lien de lien) ;
      # installer.sh pose lui-meme ~/.local/bin/coupole. Sous macOS, `readlink -f` n'existe pas avant 12.3 :
      # le lanceur n'en depend pas, ce qu'on verifie ici sur le .app.
      - name: Essai du lanceur par lien symbolique
        shell: bash
        run: |
          NOM="${{ steps.kit.outputs.nom_fichier }}"
          LIENS=$(mktemp -d)
          if [ "${{ matrix.plateforme }}" = macos ]; then
            CIBLE="$PWD/dist/$NOM.app/Contents/MacOS/$NOM"
          else
            CIBLE="$PWD/dist/$NOM/$NOM.sh"
          fi
          ln -s "$CIBLE" "$LIENS/lien1"
          (cd "$LIENS" && ln -s lien1 lien2)
          "$LIENS/lien2" --version
          if [ "${{ matrix.plateforme }}" = linux ]; then
            FAUX_HOME=$(mktemp -d)
            HOME="$FAUX_HOME" PATH=/usr/bin:/bin sh "dist/$NOM/installer.sh" | tee "$LIENS/sortie.txt"
            grep -q PATH "$LIENS/sortie.txt"
            "$FAUX_HOME/.local/bin/coupole" --version
            rm -rf "$FAUX_HOME"
          fi
          rm -rf "$LIENS"

      - name: Image disque (macOS)
        if: matrix.plateforme == 'macos'
        run: |
          NOM="${{ steps.kit.outputs.nom_fichier }}"
          VER="${{ steps.version.outputs.value }}"
          mkdir -p dmg_src
          cp -R "dist/$NOM.app" dmg_src/
          ln -s /Applications dmg_src/Applications
          hdiutil create -volname "$NOM $VER" -srcfolder dmg_src \
            -ov -format UDZO "$NOM-$VER-macos-${{ matrix.arch }}.dmg"
          ls -lh "$NOM-$VER-macos-${{ matrix.arch }}.dmg"

      - name: Installateur (Linux)
        if: matrix.plateforme == 'linux'
        shell: bash
        run: |
          NOM="${{ steps.kit.outputs.nom_fichier }}"
          TECH="${{ steps.kit.outputs.nom_technique }}"
          # installer.sh (profil utilisateur, ni sudo ni gestionnaire de paquets, lien ~/.local/bin/coupole) est
          # écrit par build_unix.py ; il doit être là, exécutable
          test -x "dist/$NOM/installer.sh"
          ARCHIVE="$NOM-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}.tar.gz"
          rm -f "$ARCHIVE"
          tar -C dist -czf "$ARCHIVE" "$NOM"
          ls -lh "$ARCHIVE"

      # Paquet Debian/Ubuntu, construit a partir du meme paquet autonome : fichiers sous /opt/coupole, lanceur
      # /usr/bin/coupole, entree de menu, icones, dependances systeme de Qt resolues par apt. Deux noms : le nom
      # versionne (coupole_0.1.1_amd64.deb) et un nom stable (coupole-linux-amd64.deb) dont l'adresse
      # « releases/latest/download/... » ne change jamais — c'est elle que l'application installee indique.
      - name: Paquet Debian (Linux)
        if: matrix.plateforme == 'linux'
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            x86_64) ARCH=amd64 ;;
            arm64)  ARCH=arm64 ;;
          esac
          python3 build_deb.py --version ${{ steps.version.outputs.value }} --arch "$ARCH"
          ls -lh *.deb
          dpkg-deb --info "coupole-linux-$ARCH.deb"

      # Le paquet doit s'installer et repondre dans un systeme nu, dependances tirees par apt : c'est le seul moyen
      # d'attraper ici une bibliotheque systeme oubliee dans « Depends », qui ne se verrait sinon que chez l'utilisateur.
      - name: Essai du paquet Debian dans un conteneur nu (Linux)
        if: matrix.plateforme == 'linux'
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            x86_64) ARCH=amd64 ;;
            arm64)  ARCH=arm64 ;;
          esac
          # Image Ubuntu officielle depuis ECR Public (pas de quota anonyme comme Docker Hub), Docker Hub en secours.
          IMAGE=public.ecr.aws/ubuntu/ubuntu:24.04
          for i in 1 2 3; do docker pull -q "$IMAGE" && break || { IMAGE=ubuntu:24.04; sleep 20; docker pull -q "$IMAGE" && break; }; done
          docker run --rm -v "$PWD:/src:ro" -e DEBIAN_FRONTEND=noninteractive "$IMAGE" bash -euxc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends /src/coupole-linux-'"$ARCH"'.deb >/dev/null
            coupole --version
            # dialogues natifs (portail XDG, GTK) et textes de Qt en francais : presents dans le paquet
            Q=$(ls -d /opt/coupole/python/lib/python3*/site-packages/PyQt6/Qt6)
            test -f "$Q/plugins/platformthemes/libqxdgdesktopportal.so"
            test -f "$Q/plugins/platformthemes/libqgtk3.so"
            test -f "$Q/translations/qtbase_fr.qm"
            # HTTPS depuis le Python embarque (mise a jour, SIMBAD) : exige ca-certificates dans Depends ; pas d apostrophe ici (chaine bash entre quotes simples)
            /opt/coupole/python/bin/python3 -c "import urllib.request; urllib.request.urlopen(\"https://api.github.com\", timeout=30); print(\"TLS OK\")"
            # bibliotheques facultatives embarquees (reproject, sep, psutil, lxml) : importees et essayees (0.2.1)
            /opt/coupole/python/bin/python3 -c "import sys; sys.path.insert(0, \"/opt/coupole/app\"); from coupole.core.bibliotheques import essai_embarquees; print(essai_embarquees())"
            LANG=fr_FR.UTF-8 coupole --help | grep -q commandes
            LANG=en_US.UTF-8 coupole --help | grep -q commands
            coupole ohp inventaire --json | head -c 200 >/dev/null
            QT_QPA_PLATFORM=offscreen timeout 60 coupole ohp catalogue --type pla >/dev/null
            QT_QPA_PLATFORM=offscreen /opt/coupole/python/bin/python3 -c "
          import sys; sys.path.insert(0, \"/opt/coupole/app\")
          from PyQt6.QtWidgets import QApplication
          app = QApplication(sys.argv)
          from coupole.gui.fenetre import FenetrePrincipale
          f = FenetrePrincipale(); f.show(); app.processEvents(); print(\"interface :\", f.windowTitle())"
            apt-get remove -y -qq coupole >/dev/null
            test ! -e /opt/coupole && test ! -e /usr/bin/coupole && echo "desinstallation propre"
          '

      - name: Deposer les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: paquet-${{ matrix.plateforme }}-${{ matrix.arch }}
          path: |
            *.dmg
            *-linux-*.tar.gz
            *.deb
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Une seule Release, une fois les trois paquets construits.
  # ──────────────────────────────────────────────────────────────────────
  publier:
    needs: [build, build-unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Lire kit.json
        id: kit
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          k = json.load(open('kit.json'))
          for cle in ('nom_technique', 'nom_fichier', 'nom_affiche', 'depot_distribution'):
              print(f"{cle}={k.get(cle, '')}")
          PY

      - name: Determiner la version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rassembler les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Mettre a plat
        shell: bash
        run: |
          mkdir -p publication
          find artefacts -type f -exec cp {} publication/ \;
          # L'archive applicative ne contient que du Python pur : les trois
          # jobs produisent la meme, une seule suffit.
          ls -lh publication

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ steps.kit.outputs.depot_distribution }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          name: ${{ steps.kit.outputs.nom_affiche }} ${{ steps.version.outputs.value }}
          tag_name: v${{ steps.version.outputs.value }}
          draft: false
          files: publication/*
          # Les notes sont ecrites dans les trois langues, chacune sous son
          # propre titre. L'application n'affiche que la section de la langue
          # de l'utilisateur : un utilisateur neerlandais lisait jusqu'ici du
          # francais dans sa fenetre de mise a jour.
          body: |
            ## Français

            ### Téléchargement

            | Système | Fichier |
            |---|---|
            | **Windows** | `${{ steps.kit.outputs.nom_fichier }}-Setup-${{ steps.version.outputs.value }}.exe` |
            | **macOS Apple Silicon** | `${{ steps.kit.outputs.nom_fichier }}-${{ steps.version.outputs.value }}-macos-arm64.dmg` |
            | **macOS Intel** | `${{ steps.kit.outputs.nom_fichier }}-${{ steps.version.outputs.value }}-macos-x86_64.dmg` |
            | **Ubuntu / Debian x86_64** | `${{ steps.kit.outputs.nom_technique }}_${{ steps.version.outputs.value }}_amd64.deb` |
            | **Ubuntu / Debian ARM64** | `${{ steps.kit.outputs.nom_technique }}_${{ steps.version.outputs.value }}_arm64.deb` |
            | **Autre Linux x86_64** | `${{ steps.kit.outputs.nom_fichier }}-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz` |
            | **Autre Linux ARM64** | `${{ steps.kit.outputs.nom_fichier }}-${{ steps.version.outputs.value }}-linux-arm64.tar.gz` |

            Tout est inclus (Python, PyQt6, numpy, astropy...) : rien d'autre à installer. ASTAP reste facultatif
            (menu Outils > Assistant ASTAP). Aucun mot de passe administrateur n'est demandé.

            **Windows** peut afficher « Windows a protégé votre ordinateur » au premier lancement (installeur non
            signé) : **Informations complémentaires**, puis **Exécuter quand même**. Une seule fois.

            **macOS** refuse d'ouvrir une application non signée : **clic droit**, **Ouvrir**, confirmer.

            **Ubuntu 22.04+ / Debian 12+** : `sudo apt install ./coupole_${{ steps.version.outputs.value }}_amd64.deb`
            (apt installe les bibliothèques Qt nécessaires ; commande `coupole`, entrée de menu ; `sudo apt remove coupole`
            pour désinstaller). Nom stable : `coupole-linux-amd64.deb` / `coupole-linux-arm64.deb`.

            **Autre Linux** : décompresser, lancer `installer.sh` (installation dans `~/.local/share`, entrée de menu).

            Sans paquet : `pipx install git+https://github.com/${{ steps.kit.outputs.depot_distribution }}`
            ou les scripts `install.sh` / `install.ps1` des sources (voir README).

            ### Mise à jour

            Déjà installée ? Ne téléchargez rien : l'application propose cette version au démarrage, sur les trois
            systèmes. L'archive `*-app-*.zip` sert à cette mise à jour automatique. Installation par `.deb` : l'application
            signale la version et indique le `.deb` à installer (`sudo apt install ./coupole-linux-amd64.deb`).

            Historique : `CHANGELOG.md`.

            ## English

            ### Download

            | System | File |
            |---|---|
            | **Windows** | `${{ steps.kit.outputs.nom_fichier }}-Setup-${{ steps.version.outputs.value }}.exe` |
            | **macOS Apple Silicon** | `${{ steps.kit.outputs.nom_fichier }}-${{ steps.version.outputs.value }}-macos-arm64.dmg` |
            | **macOS Intel** | `${{ steps.kit.outputs.nom_fichier }}-${{ steps.version.outputs.value }}-macos-x86_64.dmg` |
            | **Ubuntu / Debian x86_64** | `${{ steps.kit.outputs.nom_technique }}_${{ steps.version.outputs.value }}_amd64.deb` |
            | **Ubuntu / Debian ARM64** | `${{ steps.kit.outputs.nom_technique }}_${{ steps.version.outputs.value }}_arm64.deb` |
            | **Other Linux x86_64** | `${{ steps.kit.outputs.nom_fichier }}-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz` |
            | **Other Linux ARM64** | `${{ steps.kit.outputs.nom_fichier }}-${{ steps.version.outputs.value }}-linux-arm64.tar.gz` |

            Everything is included (Python, PyQt6, numpy, astropy...): nothing else to install. ASTAP stays optional
            (Tools menu > ASTAP assistant). No administrator password is asked for.

            **Windows** may show "Windows protected your PC" on first launch (unsigned installer): **More info**,
            then **Run anyway**. Only once.

            **macOS** refuses to open an unsigned application: **right click**, **Open**, confirm.

            **Ubuntu 22.04+ / Debian 12+**: `sudo apt install ./coupole_${{ steps.version.outputs.value }}_amd64.deb`
            (apt installs the required Qt libraries; `coupole` command, menu entry; `sudo apt remove coupole` to
            uninstall). Stable names: `coupole-linux-amd64.deb` / `coupole-linux-arm64.deb`.

            **Other Linux**: unpack, run `installer.sh` (installs into `~/.local/share`, adds a menu entry).

            Without a package: `pipx install git+https://github.com/${{ steps.kit.outputs.depot_distribution }}`
            or the `install.sh` / `install.ps1` scripts of the sources (see README).

            ### Updating

            Already installed? Download nothing: the application offers this version at startup, on all three
            systems. The `*-app-*.zip` archive exists for that automatic update. `.deb` installation: the application
            announces the version and points to the `.deb` to install (`sudo apt install ./coupole-linux-amd64.deb`).

            History: `CHANGELOG.en.md`.

  # ──────────────────────────────────────────────────────────────────────
  # Une seule Release en ligne. Une fois la nouvelle publiee ET complete (tous les actifs attendus presents), les
  # Releases precedentes et leurs tags sont supprimes, ainsi que les artefacts de construction (la Release garde les
  # fichiers). Jamais la Release qu'on vient de publier ; et si elle est incomplete, rien n'est supprime : une
  # Release ancienne mais entiere vaut mieux qu'aucune. La mise a jour automatique de l'application interroge
  # « releases/latest » et des noms stables (coupole-app-<version>.zip par prefixe, coupole-linux-<arch>.deb) :
  # elle ne depend d'aucun tag fixe.
  # ──────────────────────────────────────────────────────────────────────
  nettoyer:
    needs: publier
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Lire kit.json et la version
        id: info
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          k = json.load(open('kit.json'))
          print('depot=' + k['depot_distribution'])
          print('nom_fichier=' + k['nom_fichier'])
          print('nom_technique=' + k['nom_technique'])
          PY
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME#v}"
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Verifier que la nouvelle Release est complete, puis supprimer les precedentes et les artefacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ steps.info.outputs.depot }}
        run: |
          V="${{ steps.info.outputs.version }}"
          NOM="${{ steps.info.outputs.nom_fichier }}"
          TECH="${{ steps.info.outputs.nom_technique }}"
          ACTIFS=$(gh release view "v$V" --json assets --jq '.assets[].name')
          echo "Actifs de v$V :"; echo "$ACTIFS"
          MANQUE=0
          for ATTENDU in "$NOM-Setup-$V.exe" "$TECH-app-$V.zip" "$NOM-$V-macos-arm64.dmg" "$NOM-$V-macos-x86_64.dmg" \
                         "$NOM-$V-linux-x86_64.tar.gz" "$NOM-$V-linux-arm64.tar.gz" \
                         "${TECH}_${V}_amd64.deb" "${TECH}_${V}_arm64.deb" "$TECH-linux-amd64.deb" "$TECH-linux-arm64.deb"; do
            if ! grep -qx "$ATTENDU" <<< "$ACTIFS"; then
              echo "::warning::actif manquant : $ATTENDU"
              MANQUE=1
            fi
          done
          if [ "$MANQUE" != 0 ]; then
            echo "Release v$V incomplete : les precedentes sont conservees, rien n'est supprime."
            exit 0
          fi
          # Releases precedentes (jamais celle qu'on vient de publier) : Release + tag
          for TAG in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$TAG" != "v$V" ]; then
              echo "Suppression de la Release $TAG et de son tag"
              gh release delete "$TAG" --cleanup-tag --yes || echo "::warning::echec de la suppression de $TAG"
            fi
          done
          # Artefacts de construction : la Release garde les fichiers, ils ne servent plus a rien
          for ID in $(gh api --paginate "repos/$GH_REPO/actions/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$ID" >/dev/null && echo "artefact $ID supprime" \
              || echo "::warning::artefact $ID non supprime"
          done
          echo "Une seule Release en ligne : v$V"
