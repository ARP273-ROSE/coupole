name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliothèques Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            poppler-utils
      - name: Installation
        run: python -m pip install ".[test]"
      # 0.2.1 : dossier de sortie sur un lecteur RÉSEAU mappé (DRIVE_REMOTE ; `subst` ne suffit pas) — le cas d'un
      # retour d'utilisateur (possession non reconnue sous Windows) ; tests/test_partage_windows.py
      - name: Lecteur réseau de test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # nom de la machine, pas « localhost » : SQLite accepte l'autorité « localhost » dans une URI, et le
          # défaut de la 0.2.0 (lettre résolue en UNC → file://serveur/…) ne se verrait pas
          $partage = '\\' + $env:COMPUTERNAME + '\C$'
          net use X: $partage /persistent:no
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import ctypes; t = ctypes.windll.kernel32.GetDriveTypeW('X:\\'); print('GetDriveTypeW(X:) =', t); assert t == 4"
          "COUPOLE_TEST_LECTEUR_RESEAU=X:" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: "Tests (sans réseau ni traitement de référence : les tests concernés sont sautés)"
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs
      - name: "Liens du guide ASTAP (réseau : chaque adresse, pour chaque système, doit répondre 200)"
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          QT_QPA_PLATFORM: offscreen
          COUPOLE_TEST_LIENS: '1'
        run: python -m pytest -q -rs tests/test_cli.py -k liens_astap
