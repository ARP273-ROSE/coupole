<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo de Coupole : une coupole d'observatoire, trappe ouverte sur une étoile. Dessiné à la main, licence GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1A33"/>
      <stop offset="1" stop-color="#1C3A6B"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9EEF5"/>
      <stop offset="0.55" stop-color="#C9D3E1"/>
      <stop offset="1" stop-color="#97A6BC"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="120" fill="url(#ciel)"/>
  <g>
    <!-- étoiles discrètes -->
    <g fill="#FFFFFF" opacity="0.75">
      <circle cx="52" cy="62" r="1.8"/><circle cx="84" cy="38" r="1.3"/><circle cx="196" cy="54" r="1.6"/>
      <circle cx="214" cy="96" r="1.2"/><circle cx="40" cy="104" r="1.2"/><circle cx="168" cy="30" r="1.1"/>
    </g>
    <!-- bâtiment -->
    <rect x="72" y="170" width="112" height="60" fill="#2A3A58"/>
    <rect x="72" y="170" width="112" height="8" fill="#1B2A4A"/>
    <!-- coupole -->
    <path d="M48 172 A80 80 0 0 1 208 172 Z" fill="url(#dome)"/>
    <!-- trappe ouverte -->
    <path d="M113 95 L143 95 L140 172 L116 172 Z" fill="#0F1A33"/>
    <path d="M113 95 Q128 88 143 95" fill="none" stroke="#7F8FA8" stroke-width="2"/>
    <!-- étoile vue par la trappe -->
    <g transform="translate(128 60)">
      <path d="M0 -26 L5 -5 L26 0 L5 5 L0 26 L-5 5 L-26 0 L-5 -5 Z" fill="#F2C14E"/>
      <circle r="5" fill="#FFF4D6"/>
    </g>
    <!-- sol -->
    <path d="M61.7 228 A120 120 0 0 0 194.3 228 Z" fill="#14213A"/>
  </g>
  <circle cx="128" cy="128" r="120" fill="none" stroke="#1C6DB4" stroke-width="6"/>
</svg>
